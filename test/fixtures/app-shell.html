<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App shell</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { font: 16px system-ui, sans-serif; }
  #app { height: 100%; overflow-y: auto; }
  .bar { background: #0f766e; color: #fff; padding: 18px 16px; }
  .hero { display: block; width: 100%; height: 200px; object-fit: cover; }
  .content { padding: 16px; }
</style>
</head>
<body>
  <div id="app" data-expect="bleed">
    <div class="bar" data-expect="bleed" data-probe-column="#0f766e"><span data-expect="inset">An app that scrolls a div instead of the page</span></div>
    <img class="hero" data-expect="bleed" alt="" src="img/banner.jpg">
    <p class="content" data-expect="inset">The shell itself must reach into the column and must not become sideways-scrollable.</p>
    <div style="height:1400px"></div>
  </div>
</body>
</html>
