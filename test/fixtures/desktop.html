<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desktop-only layout (no viewport meta)</title>
<style>
  body { margin: 0; font: 14px/1.4 Verdana, sans-serif; }
  .top { background: #036; color: #fff; padding: 20px; }
  .col { width: 960px; margin: 0 auto; }
  img { display: block; width: 100%; height: 300px; object-fit: cover; }
</style>
</head>
<body>
  <div class="top" data-expect="none">Old-school site header</div>
  <img data-expect="none" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 1'%3E%3Crect width='4' height='1' fill='%23699'/%3E%3C/svg%3E">
  <div class="col"><p data-expect="none">A page with no viewport meta lays out at 980 px and is scaled down. Duofari leaves it alone by default.</p></div>
</body>
</html>
