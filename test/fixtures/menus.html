<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menus that open later</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px system-ui, sans-serif; }
  /* The cover .art makes Duofari extend the header with the padding recipe,
     so the menu and search panel, which open inside it later, are laid out
     against the grown padding box until Duofari pins them back. */
  header { position: relative; height: 56px; background: #1e3a8a; color: #fff; padding: 16px; }
  header .art { position: absolute; inset: 0; background: linear-gradient(90deg, #1e3a8a, #6d28d9); }
  header .title { position: relative; }
  .menu-button { position: absolute; right: 12px; top: 10px; }
  .menu { display: none; position: absolute; right: 0; top: 56px; width: 200px; background: #fff; color: #000; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
  .menu a { display: block; padding: 10px 16px; color: inherit; }
  .open .menu { display: block; }
  .search { display: none; position: absolute; left: 0; right: 0; top: 56px; padding: 8px 16px; background: #f1f5f9; }
  .search input { width: 100%; }
  .searching .search { display: block; }
</style>
</head>
<body>
  <div id="wrap">
    <header data-expect="bleed" id="hdr"><div class="art"></div><span class="title" data-expect="inset">Site</span>
      <button class="menu-button" data-expect="inset" onclick="document.getElementById('wrap').classList.toggle('open')">Menu</button>
      <nav class="menu"><a href="#">Home</a><a href="#">About</a><a href="#">Contact</a></nav>
      <div class="search"><input placeholder="Search"></div>
    </header>
  </div>
  <p style="margin:16px" data-expect="inset">Opening the menu or search after Duofari has run must not put them under Safari's controls.</p>
  <div style="height:900px"></div>
</body>
</html>
