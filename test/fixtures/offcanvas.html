<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Off-canvas menu</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 system-ui, sans-serif; }
  /* The classic pattern: a wrapper hides a closed drawer parked past its right edge. */
  .site { position: relative; overflow-x: hidden; }
  .drawer { position: absolute; top: 0; right: 0; width: 260px; height: 420px; transform: translateX(100%);
    background: #fff; padding: 16px; box-shadow: -2px 0 8px rgba(0,0,0,.2); }
  .site-header { position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 5; background: #4a2c82; color: #fff; padding: 16px; }
  .hero { margin-top: 56px; display: block; width: 100%; height: 200px; object-fit: cover; }
  .band { background: #fde68a; padding: 16px; }
  /* Scroll-in animations: content waits off to the right, fully transparent. */
  .reveal { opacity: 0; transform: translateX(120px); }
  .site2 { overflow-x: hidden; }
</style>
</head>
<body>
  <header class="site-header" data-expect="bleed"><span data-expect="inset">Fixed header escapes the wrapper</span></header>
  <div class="site">
    <nav class="drawer" aria-hidden="true"><p>Drawer text that must stay hidden.</p><a href="#">Sign in</a></nav>
    <img class="hero" data-expect="none" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 2'%3E%3Crect width='4' height='2' fill='%2399c'/%3E%3C/svg%3E">
    <div class="band" data-expect="none"><span data-expect="inset">Band inside the drawer's wrapper: left alone</span></div>
  </div>
  <div class="site2">
    <div class="band" data-expect="bleed" style="background:#bbf7d0"><span data-expect="inset">Band in a wrapper that only hides transparent content</span></div>
    <div class="reveal"><p>Animated paragraph waiting to slide in.</p></div>
  </div>
  <div style="height:900px"></div>
</body>
</html>
