<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTL page</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 18px/1.6 system-ui, sans-serif; }
  header { background: #7a1f5c; color: #fff; padding: 14px 16px; }
  .hero { display: block; width: 100%; height: 200px; object-fit: cover; }
  main { padding: 0 16px; }
</style>
</head>
<body>
  <header data-expect="bleed"><span data-expect="inset">عنوان الموقع</span></header>
  <img class="hero" data-expect="bleed" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 2'%3E%3Crect width='4' height='2' fill='%23c58'/%3E%3Crect width='1' height='2' fill='%23fff' fill-opacity='.4'/%3E%3C/svg%3E">
  <main><p data-expect="inset">هذا نص تجريبي باللغة العربية يجب ألا يدخل تحت أزرار سفاري الجانبية مهما حدث.</p></main>
  <div style="height:800px"></div>
</body>
</html>
