<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTL page</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 18px/1.6 system-ui, sans-serif; }
  header { background: #7a1f5c; color: #fff; padding: 14px 16px; }
  .hero { display: block; width: 100%; height: 200px; object-fit: cover; }
  main { padding: 0 16px; }
  /* The cover .art makes Duofari extend the feature with the padding recipe.
     With the column on the left its padding box grows leftwards, so the
     button (positioned from the left) has to be pinned back, and the art,
     cropped well beyond the column's width, keeps its position. */
  .feature { position: relative; height: 200px; display: flex; align-items: flex-end; padding: 16px; background: #1f6f5c; color: #fff; }
  .feature .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .feature h2 { position: relative; margin: 0; font-size: 22px; }
  .feature .menu { position: absolute; left: 12px; top: 12px; width: 36px; height: 36px; border: 0; border-radius: 18px; background: rgba(0,0,0,.4); color: #fff; }
  /* Cover-fitted with art cropped away beside it: revealed, not rescaled. */
  .banner { display: block; width: 100%; height: 200px; object-fit: cover; }
</style>
</head>
<body>
  <header data-expect="none"><span data-expect="inset">عنوان الموقع</span></header>
  <img class="hero" data-expect="none" alt="" src="img/photo.jpg">
  <!-- data-probe-y: the banner art's sun, where a sideways shift shows. -->
  <section class="feature" data-probe-y="0.25">
    <img class="art" alt="" src="img/banner.jpg">
    <h2 data-expect="inset">قصة اليوم</h2>
    <button class="menu" data-expect="inset" aria-label="القائمة">☰</button>
  </section>
  <main><p data-expect="inset">هذا نص تجريبي باللغة العربية يجب ألا يدخل تحت أزرار سفاري الجانبية مهما حدث.</p></main>
  <img class="banner" data-probe-y="0.25" alt="" src="img/banner.jpg">
  <div style="height:800px"></div>
</body>
</html>
