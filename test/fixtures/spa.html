<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Single-page app</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 system-ui, sans-serif; }
  .bar { background: #222; color: #fff; padding: 12px 16px; }
  .hero { display: block; width: 100%; height: 220px; object-fit: cover; }
  .content { padding: 16px; }
</style>
</head>
<body>
  <div id="app"><div class="bar" data-expect="bleed">Loading…</div></div>
  <script>
    // Renders a "route" after a delay and swaps it on pushState navigation, the
    // way client-side frameworks do.
    const routes = {
      '/a': '<div class="bar" data-expect="bleed">Route A</div><img class="hero" data-expect="bleed" alt="" src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 4 2%27%3E%3Crect width=%274%27 height=%272%27 fill=%27%23e70%27/%3E%3C/svg%3E"><p class="content" data-expect="inset">Route A content.</p>',
      '/b': '<div class="bar" data-expect="bleed" style="background:#06c">Route B</div><p class="content" data-expect="inset">Route B has no hero image.</p>',
    };
    function render(path) { document.getElementById('app').innerHTML = routes[path] || routes['/a']; }
    window.navigateTo = (path) => { history.pushState({}, '', '#' + path); render(path); };
    setTimeout(() => render('/a'), 150);
  </script>
</body>
</html>
